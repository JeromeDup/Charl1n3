document.getElementById('check').addEventListener('click',()=>{let ok=0;fields.forEach(f=>{const good=normalize(f.value)===normalize(f.dataset.answer);f.classList.toggle('correct',good);f.classList.toggle('wrong',!good);if(good)ok++;});document.getElementById('score').textContent=`${ok} / ${fields.length} correct${ok>1?'s':''}`;});
document.getElementById('show').addEventListener('click',()=>{fields.forEach(f=>{f.value=f.dataset.answer;f.classList.remove('wrong');f.classList.add('correct');});document.getElementById('score').textContent='Réponses affichées';});
document.getElementById('reset').addEventListener('click',()=>{fields.forEach(f=>{f.value='';f.classList.remove('correct','wrong');});document.getElementById('score').textContent='';});
</script></body></html>
