<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Exercices de grammaire</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

h1 {
    text-align: center;
}

#commandes {
    text-align: center;
    margin: 25px;
}

button {
    font-size: 18px;
    padding: 10px 25px;
    margin: 5px;
    cursor: pointer;
}

.phrase {
    background: white;
    padding: 10px 20px;
    margin: 15px 0;
    border-radius: 8px;
    box-shadow: 0 2px 5px #ccc;
}

.svg-zone {
    position: relative;
    width: 100%;
    line-height: 0;
}

.svg-zone svg {
    display: block;
    width: 100%;
    height: auto;
}

/* Champs de réponse */

.champ-reponse {
    position: absolute;
    z-index: 2;

    box-sizing: border-box;

    padding: 0;

    border: 1px solid #777;
    border-radius: 1px;

    background: rgba(255,255,255,0.85);

    text-align: center;

    font-family:
        "Comic Sans MS",
        "Segoe Print",
        cursive;

    font-size: 15px;
    line-height: 1;

    color: #222;
    outline: none;
}

.champ-reponse:focus {
    border: 2px solid #2878d0;
    background: white;
}

.champ-reponse.correct {
    border: 1px solid green;
    background: rgba(180,255,180,0.8);
}

.champ-reponse.incorrect {
    border: 1px solid red;
    background: rgba(255,180,180,0.8);
}

.correction {
    color: #176b17;
    font-weight: bold;
    font-size: 13px;
    margin-top: 8px;
}

#resultat {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 25px;
}

</style>

</head>


<body>

<h1>Exercice de grammaire</h1>

<div id="commandes">

    <button onclick="nouvelExercice()">
        Nouvel exercice
    </button>

    <button onclick="verifier()">
        Vérifier les réponses
    </button>

    <button onclick="window.location.href='../index.html'">
        Retour au menu
    </button>

</div>

<div id="exercice"></div>

<div id="resultat"></div>


<script>

// ==================================================
// CONFIGURATION
// ==================================================

const MIN_PHRASES = 3;
const MAX_PHRASES = 5;

const MIN_CIBLES = 2;
const MAX_CIBLES = 4;


// ==================================================
// DONNEES
// ==================================================

let phrases = [];
let exerciceActuel = [];


// ==================================================
// IDENTIFICATION DES RECTANGLES MAGENTA
// ==================================================

function estRectangleMagenta(element) {

    const couleur = (
        element.getAttribute("fill") || ""
    ).replace(/\s/g, "").toLowerCase();

    return couleur.includes("92.549133%") &&
           couleur.includes("54.899597%");

}


// ==================================================
// POSITIONNEMENT D'UN CHAMP
// ==================================================

function positionnerChamp(input, marqueur, zone, svg) {

    const boite = marqueur.getBBox();
    const matrice = marqueur.getScreenCTM();

    if (!matrice) return;

    const p1 = svg.createSVGPoint();
    p1.x = boite.x;
    p1.y = boite.y;

    const p2 = svg.createSVGPoint();
    p2.x = boite.x + boite.width;
    p2.y = boite.y + boite.height;

    const ecran1 = p1.matrixTransform(matrice);
    const ecran2 = p2.matrixTransform(matrice);

    const rectZone = zone.getBoundingClientRect();

    const largeur = ecran2.x - ecran1.x;
    const hauteur = ecran2.y - ecran1.y;

    const hauteurChamp = hauteur * 1.45;
    
    input.style.fontSize = (hauteur * 1.3) + "px";
    input.style.lineHeight = hauteurChamp + "px";
    input.style.left =
        (ecran1.x - rectZone.left) + "px";

    input.style.top =
        (
            ecran1.y - rectZone.top
            - (hauteurChamp - hauteur) / 2
        ) + "px";

    input.style.width = largeur + "px";
    input.style.height = hauteurChamp + "px";

}


// ==================================================
// REPOSITIONNEMENT
// ==================================================

function repositionnerZone(zone) {

    if (!zone._placements || !zone._svg) return;

    zone._placements.forEach(element => {

        positionnerChamp(
            element.input,
            element.marqueur,
            zone,
            zone._svg
        );

    });

}

// ==================================================
// RENDRE LES IDENTIFIANTS SVG UNIQUES
// ==================================================

function rendreIdentifiantsUniques(svg, prefixe) {

    const correspondances = new Map();

    // Renommer tous les identifiants.

    svg.querySelectorAll("[id]").forEach(element => {

        const ancienId = element.id;
        const nouvelId = prefixe + ancienId;

        correspondances.set(ancienId, nouvelId);

        element.id = nouvelId;

    });

    // Corriger toutes les références aux identifiants.

    svg.querySelectorAll("*").forEach(element => {

        Array.from(element.attributes).forEach(attribut => {

            let valeur = attribut.value;

            // Références du type href="#glyph-0-1"
            if (
                (attribut.name === "href" ||
                 attribut.name === "xlink:href") &&
                valeur.startsWith("#")
            ) {

                const ancienId = valeur.substring(1);

                if (correspondances.has(ancienId)) {

                    attribut.value =
                        "#" + correspondances.get(ancienId);

                }

            }

            // Références du type url(#identifiant)
            valeur = valeur.replace(
                /url\(#([^)]+)\)/g,
                (match, ancienId) => {

                    if (correspondances.has(ancienId)) {

                        return "url(#" +
                            correspondances.get(ancienId) +
                            ")";

                    }

                    return match;

                }
            );

            element.setAttribute(attribut.name, valeur);

        });

    });

}


function rendreIdentifiantsUniques(svg, prefixe) {

    const correspondances = new Map();

    // Renommer les identifiants.
    svg.querySelectorAll("[id]").forEach(element => {

        const ancienId = element.getAttribute("id");
        const nouvelId = prefixe + ancienId;

        correspondances.set(ancienId, nouvelId);

        element.setAttribute("id", nouvelId);

    });

    // Corriger les références en conservant leur namespace.
    const elements = [svg, ...svg.querySelectorAll("*")];

    elements.forEach(element => {

        Array.from(element.attributes).forEach(attribut => {

            let valeur = attribut.value;

            valeur = valeur.replace(
                /#([a-zA-Z0-9_-]+)/g,
                (match, ancienId) => {

                    if (correspondances.has(ancienId)) {
                        return "#" + correspondances.get(ancienId);
                    }

                    return match;

                }
            );

            if (valeur !== attribut.value) {

                element.setAttributeNS(
                    attribut.namespaceURI,
                    attribut.name,
                    valeur
                );

            }

        });

    });

}


// ==================================================
// RENDRE LES IDENTIFIANTS SVG UNIQUES
// ==================================================

function rendreIdentifiantsUniques(svg, prefixe) {

    const XLINK_NS = "http://www.w3.org/1999/xlink";
    const correspondances = new Map();

    // 1. Renommer les identifiants

    svg.querySelectorAll("[id]").forEach(element => {

        const ancienId = element.getAttribute("id");
        const nouvelId = prefixe + ancienId;

        correspondances.set(ancienId, nouvelId);

        element.setAttribute("id", nouvelId);

    });

    // 2. Corriger les références aux identifiants

    const elements = [
        svg,
        ...svg.querySelectorAll("*")
    ];

    elements.forEach(element => {

        // Références xlink:href (notamment les glyphes de texte)

        const ancienneReference =
            element.getAttributeNS(XLINK_NS, "href");

        if (
            ancienneReference &&
            ancienneReference.startsWith("#")
        ) {

            const ancienId = ancienneReference.substring(1);

            if (correspondances.has(ancienId)) {

                element.setAttributeNS(
                    XLINK_NS,
                    "xlink:href",
                    "#" + correspondances.get(ancienId)
                );

            }

        }

        // Références href sans espace de noms

        const href = element.getAttribute("href");

        if (href && href.startsWith("#")) {

            const ancienId = href.substring(1);

            if (correspondances.has(ancienId)) {

                element.setAttribute(
                    "href",
                    "#" + correspondances.get(ancienId)
                );

            }

        }

        // Références url(#identifiant), par exemple pour les masques

        Array.from(element.attributes).forEach(attribut => {

            if (
                attribut.name === "href" ||
                attribut.name === "xlink:href"
            ) {
                return;
            }

            const nouvelleValeur = attribut.value.replace(
                /url\(#([^)]+)\)/g,
                (match, ancienId) => {

                    if (correspondances.has(ancienId)) {

                        return "url(#" +
                            correspondances.get(ancienId) +
                            ")";

                    }

                    return match;

                }
            );

            if (nouvelleValeur !== attribut.value) {

                element.setAttributeNS(
                    attribut.namespaceURI,
                    attribut.name,
                    nouvelleValeur
                );

            }

        });

    });

}



// ==================================================
// CHARGEMENT DU SVG
// ==================================================

async function chargerSVG(phrase, zone, phraseIndex) {

    const response = await fetch(phrase.svg);

    if (!response.ok) {

        throw new Error(
            "Impossible de charger " + phrase.svg
        );

    }

    const contenu = await response.text();

    const parser = new DOMParser();

    const documentSVG = parser.parseFromString(
        contenu,
        "image/svg+xml"
    );

    const svg = document.importNode(
        documentSVG.documentElement,
        true
    );

    rendreIdentifiantsUniques(
        svg,
        "phrase_" + phraseIndex + "_"
    );

    // Recadrage du SVG :
    // on élimine les grandes marges inutiles.

    svg.setAttribute("viewBox", "0 0 570 50");

    svg.setAttribute("width", "570");
    svg.setAttribute("height", "50");
    
    svg.style.width = "100%";
    svg.style.height = "auto";
    svg.style.display = "block";

    zone.appendChild(svg);

    // Recherche des rectangles magenta.

    const marqueurs = Array.from(
        svg.querySelectorAll("path")
    ).filter(estRectangleMagenta);

    // Classement de gauche à droite.

    marqueurs.sort((a, b) => {

        return a.getBBox().x - b.getBBox().x;

    });

    if (marqueurs.length !== phrase.targets.length) {

        throw new Error(
            phrase.id + " : " +
            marqueurs.length + " rectangles trouvés, " +
            phrase.targets.length + " attendus."
        );

    }

    const placements = [];

    marqueurs.forEach((marqueur, targetIndex) => {

        // On masque le rectangle magenta.

        marqueur.setAttribute("fill-opacity", "0");

        // Création du champ.

        const input = document.createElement("input");

        input.type = "text";
        input.className = "champ-reponse";

        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.spellcheck = false;

        input.dataset.phrase = phraseIndex;
        input.dataset.target = targetIndex;

        zone.appendChild(input);

        placements.push({
            input: input,
            marqueur: marqueur
        });

    });

    zone._placements = placements;
    zone._svg = svg;

    // Positionnement après insertion dans la page.

    repositionnerZone(zone);

}


// ==================================================
// REDIMENSIONNEMENT
// ==================================================

window.addEventListener("resize", () => {

    document.querySelectorAll(".svg-zone").forEach(zone => {

        repositionnerZone(zone);

    });

});


// ==================================================
// CHARGEMENT DU JSON
// ==================================================

async function chargerPhrases() {

    try {

        const response = await fetch("phrases.json");

        if (!response.ok) {

            throw new Error(
                "Impossible de charger phrases.json"
            );

        }

        phrases = await response.json();

        console.log(
            phrases.length + " phrases chargées."
        );

        await nouvelExercice();

    }

    catch (error) {

        document.getElementById("exercice").innerHTML =
            "<p>Erreur : " + error.message + "</p>";

        console.error(error);

    }

}


// ==================================================
// MELANGE ALEATOIRE
// ==================================================

function melanger(tableau) {

    const copie = [...tableau];

    for (let i = copie.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copie[i], copie[j]] = [copie[j], copie[i]];

    }

    return copie;

}


// ==================================================
// SELECTION DES PHRASES
// ==================================================

function selectionnerPhrases() {

    const candidates = phrases.filter(p =>

        p.targets.length >= MIN_CIBLES &&
        p.targets.length <= MAX_CIBLES

    );

    if (candidates.length < MIN_PHRASES) {

        throw new Error(
            "Pas assez de phrases disponibles."
        );

    }

    const nombre = Math.min(

        candidates.length,

        MIN_PHRASES +
        Math.floor(
            Math.random() *
            (MAX_PHRASES - MIN_PHRASES + 1)
        )

    );

    return melanger(candidates).slice(0, nombre);

}


// ==================================================
// NOUVEL EXERCICE
// ==================================================

async function nouvelExercice() {

    try {

        exerciceActuel = selectionnerPhrases();

        document.getElementById("resultat").innerHTML = "";

        await afficherExercice();

    }

    catch (error) {

        document.getElementById("exercice").innerHTML =
            "<p>" + error.message + "</p>";

        console.error(error);

    }

}


// ==================================================
// AFFICHAGE
// ==================================================

async function afficherExercice() {

    const conteneur = document.getElementById("exercice");

    conteneur.innerHTML = "";

    for (let index = 0; index < exerciceActuel.length; index++) {

        const phrase = exerciceActuel[index];

        const bloc = document.createElement("div");
        bloc.className = "phrase";

        const zone = document.createElement("div");
        zone.className = "svg-zone";

        const correction = document.createElement("div");
        correction.className = "correction";
        correction.id = "correction_" + index;

        bloc.appendChild(zone);
        bloc.appendChild(correction);

        // IMPORTANT :
        // On insère le bloc AVANT de calculer les positions.

        conteneur.appendChild(bloc);

        await chargerSVG(phrase, zone, index);

    }

}


// ==================================================
// VERIFICATION
// ==================================================

function verifier() {

    let total = 0;
    let bonnes = 0;

    exerciceActuel.forEach((phrase, phraseIndex) => {

        const correction = document.getElementById(
            "correction_" + phraseIndex
        );

        correction.innerHTML = "";

        phrase.targets.forEach((target, targetIndex) => {

            total++;

            const input = document.querySelector(

                `input[data-phrase="${phraseIndex}"]` +
                `[data-target="${targetIndex}"]`

            );

            const reponse = input.value.trim();
            const attendue = target.answer;

            input.classList.remove(
                "correct",
                "incorrect"
            );

            if (reponse === attendue) {

                bonnes++;

                input.classList.add("correct");

            }

            else {

                input.classList.add("incorrect");

                const texte = document.createElement("div");

                texte.textContent =
                    "Terminaison attendue : " +
                    (
                        attendue === ""
                        ? "(aucune lettre)"
                        : attendue
                    );

                correction.appendChild(texte);

            }

        });

    });

    document.getElementById("resultat").textContent =

        bonnes + " bonne(s) réponse(s) sur " + total;

}


// ==================================================
// DEMARRAGE
// ==================================================

chargerPhrases();

</script>

</body>

</html>
